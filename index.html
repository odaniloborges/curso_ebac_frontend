<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário EBAC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container text-center hero">
        <div class="row d-flex justify-content-md-center">
            <div class="col-8 align-self-center">             
                <h2>Formulário EBAC</h2>
                <i class="bi bi-bootstrap-fill" style="font-size: 5rem; color: #6f42c1;" alt="Icone do Bootstrap"></i>
                <p class="h5">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ab dolorum laudantium aliquam quidem explicabo maiores, consequatur, cupiditate veniam adipisci officiis saepe possimus itaque sunt, ipsum ipsa repudiandae odit alias reiciendis!</p>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2>Entre em contato</h2>
                <form>
                    <label for="nome" class="form-label">Seu nome:</label>
                    <input id="nome" type="text" class="form-control"/>
                    <label for="email" class="form-label">Seu e-mail:</label>
                    <input id="email" type="email" class="form-control"/>
                    <label for="telefone" class="form-label">Seu telefone:</label>
                    <input id="telefone" class="form-control"></input>
                    <div class="form-check form-switch">
                        <label class="form-check-label" for="aceito-termos">Li e concordo</label>
                        <input class="form-check-input" type="checkbox" id="aceito-termos">
                    </div>
                    <button type="button" class="btn btn-success">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
